# Supabase CLI config. Used with a hosted project:
#   npx supabase link --project-ref <ref>
#   npx supabase db push --include-seed
#   npx supabase functions deploy admin-users --use-api
#   npx supabase functions deploy send-push --use-api --no-verify-jwt
project_id = "site-management"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.admin-users]
verify_jwt = true

# Called by a Database Webhook; protected by the PUSH_WEBHOOK_SECRET header instead.
[functions.send-push]
verify_jwt = false

# Telegram bot webhook; authenticated by the X-Telegram-Bot-Api-Secret-Token header (TELEGRAM_WEBHOOK_SECRET).
[functions.telegram-webhook]
verify_jwt = false

# Database Webhook on notifications INSERT (replaces send-push); x-webhook-secret = DISPATCH_WEBHOOK_SECRET.
[functions.dispatch-notification]
verify_jwt = false

# pg_cron + pg_net daily call; x-cron-secret = CRON_SECRET.
[functions.daily-summary]
verify_jwt = false
